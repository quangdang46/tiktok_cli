<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>TikTok Summarizer — Settings</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 24px; padding: 10px 20px; background: #fe2c55; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    #status { margin-top: 12px; color: #2a7; font-size: 13px; }
    .hint { color: #777; font-size: 12px; margin-top: 4px; }
    code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>TikTok Summarizer</h1>
  <p class="hint">Keys lưu local trong trình duyệt, chỉ dùng để gọi API trực tiếp — không có server trung gian.</p>

  <label>Groq API key (speech-to-text)
    <input id="groqApiKey" type="password" placeholder="gsk_…" />
  </label>
  <div class="hint">Lấy free tại <code>console.groq.com</code> → API Keys. Dùng model <code>whisper-large-v3-turbo</code>.</div>

  <label>Gemini API key (tóm tắt)
    <input id="geminiApiKey" type="password" placeholder="AIza…" />
  </label>
  <div class="hint">Lấy free tại <code>aistudio.google.com</code> → Get API key.</div>

  <label>Gemini model
    <input id="geminiModel" type="text" placeholder="gemini-2.5-flash-lite" />
  </label>

  <label>Ngôn ngữ bản tóm tắt
    <input id="summaryLanguage" type="text" placeholder="Tiếng Việt" />
  </label>

  <label>Groq STT model
    <input id="groqModel" type="text" placeholder="whisper-large-v3-turbo" />
  </label>

  <button id="save">Lưu</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
