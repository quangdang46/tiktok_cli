[project]
name = "tiktok-cli"
version = "0.1.1"
description = "TikTok URL -> local transcript CLI. No login, no LLM, caption-first with Whisper fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "yt-dlp>=2025.1",
    "faster-whisper>=1.1",
    "ctranslate2>=4.6.3",
    "huggingface-hub>=0.21,<1.0",
    "curl-cffi>=0.7",
    "av>=15,<17",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tiktok = "tiktok_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that need real network/models (deselect with -m 'not slow')",
]
